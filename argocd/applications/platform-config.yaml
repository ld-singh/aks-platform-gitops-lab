apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ld-singh/aks-platform-gitops-lab.git
    targetRevision: main
    path: platform/config
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-config
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
