apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: guestbook-environments
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - list:
        elements:
          - env: dev
          - env: uat

  template:
    metadata:
      name: 'guestbook-{{.env}}'
    spec:
      project: guestbook-nonprod

      source:
        repoURL: https://github.com/ld-singh/aks-platform-gitops-lab.git
        targetRevision: main
        path: 'apps/guestbook/overlays/{{.env}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: 'guestbook-{{.env}}'
      syncPolicy:
        syncOptions:
          - RespectIgnoreDifferences=true  
